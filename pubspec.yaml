name: todo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase core and services
  firebase_core: ^3.5.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Notifications and permissions
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Animations
  lottie: ^3.1.2
  animations: ^2.0.11

  # Audio for completion/missed task sounds
  audioplayers: ^6.1.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/todo.json
    - assets/images/logo.png
    - assets/images/google.png
    - assets/audio/complete.mpeg
    - assets/audio/missed.mpeg
    - assets/audio/pending.mpeg

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png
  macos:
    generate: true
    image_path: assets/images/logo.png
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/images/logo.png
